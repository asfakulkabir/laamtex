; -----------------------------------------------------------------------------
; Raise the upload ceilings for the slider video uploader.
;
; SliderController allows a 50 MB video. A default php.ini caps uploads at 2M
; and the whole POST at 8M, which makes a large video fail with an empty form
; instead of a validation message. 64M leaves headroom above the app's own
; limit so the app's rule is the one that reports the error.
;
; This file is honoured by CGI/FPM setups. Under mod_php the matching
; php_value directives live in .htaccess.
; -----------------------------------------------------------------------------

upload_max_filesize = 64M
post_max_size = 64M
max_file_uploads = 20

; A slow connection can take longer than the default 60s to deliver the bytes,
; and max_input_time counts only while data is arriving.
max_execution_time = 300
max_input_time = 300
memory_limit = 512M